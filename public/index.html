<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>BP Kids Pickup Board</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* Blueprint Church brand: Blueprint Blue #2121F9, Midnight Blue #0A0F2C, True Blue #4351EF,
     Charcoal #202020, Off-white #DDDDDD. Typeface: Grift (falls back if not installed). */
  :root {
    --bp-blue: #2121f9; --bp-midnight: #0a0f2c; --bp-true: #4351ef; --bp-charcoal: #202020; --bp-offwhite: #dddddd;
    --bg: #ececf0; --card: #ffffff; --ink: var(--bp-charcoal); --muted: #5d6070; --line: #d6d6de;
    --accent: var(--bp-blue); --accent-ink: #ffffff;
    --wait: var(--bp-blue); --wait-bg: #eef0ff;
    --ok: #1f7a4d; --ok-bg: #e8f4ee; --danger: #c8102e;
    --radius: 14px;
    font-family: "Grift", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
  button { font: inherit; cursor: pointer; }

  /* Brand bar */
  .bar { background: var(--bp-midnight); color: #fff; }
  .bar-in { max-width: 1100px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .lockup { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #fff; }
  .mark { width: 38px; height: 38px; border-radius: 10px; background: var(--bp-blue); display: grid; place-items: center; font-weight: 800; font-size: 22px; letter-spacing: -.02em; overflow: hidden; }
  .mark img { width: 100%; height: 100%; object-fit: contain; padding: 5px; }
  .wordmark { font-weight: 800; letter-spacing: .14em; font-size: 14px; line-height: 1.15; }
  .wordmark small { display: block; font-weight: 600; letter-spacing: .2em; font-size: 11px; color: #9aa3ff; }
  .bar .status { color: #c9ccdd; }
  .bar .link-btn { border-color: rgba(255,255,255,.25); color: #fff; }
  .tagline { text-align: center; color: var(--muted); font-size: 12px; letter-spacing: .3em; font-weight: 700; margin-top: 40px; }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 22px 20px 40px; }
  header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .brand { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--bp-blue); font-weight: 800; }
  h1 { margin: 4px 0 0; font-size: 34px; line-height: 1.1; font-weight: 800; letter-spacing: -.02em; color: var(--bp-midnight); }
  .sub { color: var(--muted); font-size: 15px; margin-top: 4px; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #9ca3af; }
  .dot.live { background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.22); }
  .dot.err { background: var(--danger); }
  .link-btn { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; color: var(--muted); font-size: 13px; text-decoration: none; }

  /* Home */
  .rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .room-tile { background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--bp-blue); border-radius: var(--radius); padding: 20px; text-align: left; text-decoration: none; color: inherit; }
  .room-tile:hover { border-color: var(--bp-blue); }
  .room-tile b { display: block; font-size: 21px; font-weight: 800; color: var(--bp-midnight); }
  .room-tile span { color: var(--muted); font-size: 14px; }
  .room-tile.admin { background: var(--bp-midnight); border-color: var(--bp-midnight); border-left-color: var(--bp-true); }
  .room-tile.admin b { color: #fff; }
  .room-tile.admin span { color: #c9ccdd; }
  .section-label { font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); font-weight: 800; margin: 28px 0 10px; }

  /* Room board */
  .empty { background: var(--card); border: 1px dashed #c3c5d4; border-radius: var(--radius); padding: 48px 20px; text-align: center; color: var(--muted); font-size: 18px; }
  .cards { display: grid; gap: 14px; }
  .pick { background: var(--card); border: 2px solid var(--bp-blue); border-left-width: 10px; border-radius: var(--radius); padding: 20px 22px; display: grid; grid-template-columns: 1fr auto; gap: 8px 20px; align-items: center; box-shadow: 0 6px 18px rgba(33,33,249,.10); }
  .pick.fresh { animation: pulse 1.2s ease-in-out 4; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 10px rgba(33,33,249,.20); } }
  .pick .label { font-size: 12px; font-weight: 800; color: var(--bp-blue); text-transform: uppercase; letter-spacing: .14em; }
  .pick .name { font-size: 36px; font-weight: 800; line-height: 1.1; letter-spacing: -.02em; color: var(--bp-midnight); }
  .pick .meta { color: var(--muted); font-size: 15px; }
  .who { display: flex; gap: 28px; flex-wrap: wrap; margin: 6px 0 2px; }
  .who .k { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .who .v { font-size: 22px; font-weight: 700; color: var(--bp-midnight); line-height: 1.3; }
  .code { display: inline-block; color: var(--bp-midnight); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 700; letter-spacing: .12em; background: var(--wait-bg); border: 1px solid #cdd1ff; border-radius: 8px; padding: 2px 10px; font-size: 22px; }
  .pick .right { grid-row: 1 / span 4; grid-column: 2; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
  .confirm-btn { background: var(--bp-blue); color: #fff; border: 0; border-radius: 12px; padding: 18px 24px; font-size: 19px; font-weight: 800; min-width: 220px; letter-spacing: .01em; }
  .confirm-btn:hover { background: #1717d6; }
  .confirm-btn:disabled { opacity: .6; }
  @media (max-width: 640px) {
    .pick { grid-template-columns: 1fr; }
    .pick .right { grid-row: auto; grid-column: 1; align-items: stretch; }
    .confirm-btn { width: 100%; }
    .pick .name { font-size: 28px; }
    .wordmark small { display: none; }
    .status .upd { display: none; }
  }
  .done-list { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .done-row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); font-size: 15px; }
  .done-row:first-child { border-top: 0; }
  .done-row .t { color: var(--muted); white-space: nowrap; }

  /* Overview */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .stat .n { font-size: 32px; font-weight: 800; color: var(--bp-midnight); }
  .stat .l { color: var(--muted); font-size: 13px; }
  .stat.wait { border-top: 4px solid var(--bp-blue); } .stat.wait .n { color: var(--bp-blue); }
  .stat.ok { border-top: 4px solid var(--ok); } .stat.ok .n { color: var(--ok); }
  .stat:first-child { border-top: 4px solid var(--bp-midnight); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 14px; font-size: 14px; color: var(--ink); }
  .chip.on { background: var(--bp-midnight); color: #fff; border-color: var(--bp-midnight); }
  .chip .c { color: var(--bp-blue); font-weight: 800; margin-left: 4px; }
  .chip.on .c { color: #9aa3ff; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  th, td { text-align: left; padding: 12px 14px; border-top: 1px solid var(--line); font-size: 15px; vertical-align: middle; }
  th { border-top: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: #c9ccdd; background: var(--bp-midnight); font-weight: 700; }
  td .code { font-size: 15px; padding: 1px 7px; }
  .pill { display: inline-block; border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 700; }
  .pill.wait { background: var(--wait-bg); color: var(--bp-blue); }
  .pill.late { background: var(--danger); color: #fff; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .undo { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 13px; padding: 0 0 0 8px; }
  .table-wrap { overflow-x: auto; }

  /* Overlays */
  .overlay { position: fixed; inset: 0; background: rgba(10,15,44,.72); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 10; }
  .dialog { background: var(--card); border-radius: 18px; padding: 28px; width: 100%; max-width: 380px; text-align: center; border-top: 6px solid var(--bp-blue); }
  .dialog h2 { margin: 0 0 6px; font-size: 22px; font-weight: 800; color: var(--bp-midnight); }
  .dialog p { margin: 0 0 18px; color: var(--muted); font-size: 15px; }
  .dialog input { width: 100%; font-size: 26px; text-align: center; letter-spacing: .3em; padding: 12px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 14px; }
  .dialog input:focus { outline: 2px solid var(--bp-blue); border-color: var(--bp-blue); }
  .dialog .confirm-btn { width: 100%; min-width: 0; }
  .dialog .err { color: var(--danger); font-size: 14px; min-height: 20px; margin-bottom: 8px; }
  .banner { background: #fde8ec; color: var(--danger); border-radius: 12px; padding: 12px 16px; margin-bottom: 14px; font-size: 15px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="bar"><div class="bar-in" id="bar"></div></div>
<div class="wrap"><div id="app"></div><div class="tagline">BELONG. BECOME. BUILD.</div></div>

<div class="overlay hidden" id="pinOverlay">
  <form class="dialog" id="pinForm" autocomplete="off">
    <h2 id="pinTitle">Enter board PIN</h2>
    <p id="pinHint">Ask the BP Kids director for the PIN.</p>
    <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" required>
    <div class="err" id="pinErr"></div>
    <button class="confirm-btn" type="submit">Start board</button>
  </form>
</div>

<script>
(() => {
  const ROOMS = [
    { slug: "nursery-1", name: "Nursery 1", ages: "0–11 months" },
    { slug: "nursery-2", name: "Nursery 2", ages: "1–2 years" },
    { slug: "sprouts", name: "Sprouts", ages: "3–5 years" },
    { slug: "stems", name: "Stems", ages: "6–9 years" },
    { slug: "grove", name: "Grove", ages: "10–14 years" },
  ];
  const POLL_MS = 4000;
  const LATE_MIN = 5;              // overview flags waits longer than this
  const RECHIME_MS = 30000;        // room re-chimes while someone is still waiting

  const qs = new URLSearchParams(location.search);
  const view = qs.get("view") === "overview" ? "overview" : (qs.get("room") ? "room" : "home");
  const room = ROOMS.find((r) => r.slug === qs.get("room"));
  const app = document.getElementById("app");

  // ---------- small helpers ----------
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtTime = (iso) => iso ? new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";
  const minsSince = (iso) => Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 60000));
  const ago = (iso) => { const m = minsSince(iso); return m < 1 ? "just now" : m === 1 ? "1 min ago" : `${m} min ago`; };
  const storage = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };
  const pinKey = view === "overview" ? "bpk-admin-pin" : "bpk-room-pin";
  let pin = storage.get(pinKey) || "";

  // ---------- sound + keep screen awake ----------
  let audioCtx = null, wakeLock = null;
  function unlockAudio() {
    try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch {}
  }
  function chime() {
    if (!audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      [880, 1175, 1568].forEach((f, i) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = "sine"; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, now + i * 0.18);
        g.gain.exponentialRampToValueAtTime(0.35, now + i * 0.18 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.18 + 0.5);
        o.connect(g).connect(audioCtx.destination);
        o.start(now + i * 0.18); o.stop(now + i * 0.18 + 0.55);
      });
    } catch {}
  }
  async function keepAwake() {
    try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch {}
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && view !== "home") keepAwake(); });

  // ---------- PIN dialog ----------
  const overlay = document.getElementById("pinOverlay");
  function askPin(message) {
    document.getElementById("pinTitle").textContent = view === "overview" ? "Enter admin PIN" : "Enter room PIN";
    document.getElementById("pinErr").textContent = message || "";
    overlay.classList.remove("hidden");
    const input = document.getElementById("pinInput");
    input.value = ""; setTimeout(() => input.focus(), 50);
  }
  document.getElementById("pinForm").addEventListener("submit", (e) => {
    e.preventDefault();
    pin = document.getElementById("pinInput").value.trim();
    storage.set(pinKey, pin);
    overlay.classList.add("hidden");
    unlockAudio(); keepAwake();
    started = true;
    poll();
  });

  // ---------- API ----------
  async function api(path, opts = {}) {
    const res = await fetch(path, { ...opts, headers: { "content-type": "application/json", "x-board-pin": pin, ...(opts.headers || {}) } });
    const body = await res.json().catch(() => ({}));
    if (res.status === 401) { storage.del(pinKey); throw Object.assign(new Error(body.error || "Wrong PIN."), { auth: true }); }
    if (!res.ok) throw new Error(body.error || `Error ${res.status}`);
    return body;
  }

  // ---------- state ----------
  let data = null, lastError = "", started = false, timer = null;
  let seenWaiting = new Set(), freshIds = new Set(), lastChime = 0, filter = "all";
  const pending = new Set();

  async function poll() {
    clearTimeout(timer);
    try {
      const roomParam = view === "overview" ? "all" : room.slug;
      data = await api(`/api/pickups?room=${encodeURIComponent(roomParam)}`);
      lastError = "";
      handleNew();
    } catch (err) {
      if (err.auth) { askPin(err.message); render(); return; }
      lastError = err.message;
    }
    render();
    timer = setTimeout(poll, POLL_MS);
  }

  function handleNew() {
    const waiting = data.pickups.filter((p) => !p.confirmedAt);
    const ids = new Set(waiting.map((p) => p.id));
    const firstLoad = seenWaiting.size === 0 && !handleNew.ran;
    handleNew.ran = true;
    freshIds = new Set([...ids].filter((id) => !seenWaiting.has(id)));
    if (view === "room") {
      if (freshIds.size && !firstLoad) { chime(); lastChime = Date.now(); }
      else if (ids.size && Date.now() - lastChime > RECHIME_MS) { chime(); lastChime = Date.now(); }
    }
    seenWaiting = ids;
  }

  async function confirmPickup(id) {
    pending.add(id); render();
    try {
      const r = await api("/api/confirm", { method: "POST", body: JSON.stringify({ id }) });
      const p = data.pickups.find((x) => x.id === id); if (p) p.confirmedAt = r.confirmedAt;
      seenWaiting.delete(id);
    } catch (err) { lastError = err.message; if (err.auth) askPin(err.message); }
    pending.delete(id); render();
  }

  async function undoConfirm(id) {
    if (!window.confirm("Mark this child as NOT confirmed?")) return;
    try {
      await api("/api/confirm", { method: "DELETE", body: JSON.stringify({ id }) });
      const p = data.pickups.find((x) => x.id === id); if (p) p.confirmedAt = null;
    } catch (err) { lastError = err.message; }
    render();
  }

  // ---------- rendering ----------
  function statusHtml() {
    const cls = lastError ? "err" : (data ? "live" : "");
    const txt = lastError ? "Connection problem" : (data ? "Live" : "Connecting…");
    const upd = !lastError && data ? `<span class="upd"> · updated ${esc(fmtTime(data.updatedAt))}</span>` : "";
    return `<div class="status"><span class="dot ${cls}"></span>${esc(txt)}${upd}</div>`;
  }

  function renderHome() {
    app.innerHTML = `
      <header class="top"><div><div class="brand">BP Kids</div><h1>Pickup Board</h1>
      <div class="sub">Open this on each room's tablet and pick that room.</div></div></header>
      <div class="section-label">Room boards</div>
      <div class="rooms">${ROOMS.map((r) => `<a class="room-tile" style="text-decoration:none;color:inherit" href="?room=${r.slug}"><b>${esc(r.name)}</b><span>${esc(r.ages)}</span></a>`).join("")}</div>
      <div class="section-label">Admins</div>
      <div class="rooms"><a class="room-tile admin" style="text-decoration:none" href="?view=overview"><b>Overview</b><span>Every checkout and confirmation today</span></a></div>`;
  }

  function renderRoom() {
    const waiting = data ? data.pickups.filter((p) => !p.confirmedAt).sort((a, b) => a.checkedOutAt < b.checkedOutAt ? -1 : 1) : [];
    const done = data ? data.pickups.filter((p) => p.confirmedAt).sort((a, b) => a.confirmedAt < b.confirmedAt ? 1 : -1) : [];
    app.innerHTML = `
      <header class="top">
        <div><div class="brand">BP Kids · Room board</div><h1>${esc(room.name)}</h1><div class="sub">${esc(room.ages)}</div></div>
      </header>
      ${lastError ? `<div class="banner">${esc(lastError)} — retrying…</div>` : ""}
      ${!started ? `<div class="empty">Tap below to start this board.<br><br><button class="confirm-btn" id="startBtn">Start ${esc(room.name)} board</button></div>` :
        waiting.length ? `<div class="cards">${waiting.map((p) => `
          <div class="pick ${freshIds.has(p.id) ? "fresh" : ""}">
            <div class="name">${esc(p.firstName)} ${esc(p.lastName)}</div>
            <div class="who">
              <div><div class="k">Parent</div><div class="v">${esc(p.parentName || "Not recorded")}</div></div>
              <div><div class="k">Security code</div><div class="v"><span class="code">${esc(p.securityCode || "—")}</span></div></div>
            </div>
            <div class="meta">Checked out at the desk ${fmtTime(p.checkedOutAt)} · ${ago(p.checkedOutAt)}</div>
            <div class="right"><button class="confirm-btn" data-confirm="${esc(p.id)}" ${pending.has(p.id) ? "disabled" : ""}>${pending.has(p.id) ? "Saving…" : "Confirm check out"}</button></div>
          </div>`).join("")}</div>`
        : `<div class="empty">${data ? "No pickups waiting. New ones will pop up here with a chime." : "Loading…"}</div>`}
      ${started && done.length ? `<div class="section-label">Confirmed today (${done.length})</div>
        <div class="done-list">${done.map((p) => `<div class="done-row"><span><b>${esc(p.firstName)} ${esc(p.lastName)}</b> · ${esc(p.parentName || "—")} <span class="code" style="font-size:13px">${esc(p.securityCode)}</span></span><span class="t">confirmed ${fmtTime(p.confirmedAt)}</span></div>`).join("")}</div>` : ""}`;
    const start = document.getElementById("startBtn");
    if (start) start.onclick = () => { unlockAudio(); keepAwake(); if (!pin) askPin(); else { started = true; poll(); } };
    app.querySelectorAll("[data-confirm]").forEach((b) => b.onclick = () => confirmPickup(b.dataset.confirm));
  }

  function renderOverview() {
    const all = data ? data.pickups : [];
    const rows = filter === "all" ? all : all.filter((p) => p.room === filter);
    const waitingCount = (list) => list.filter((p) => !p.confirmedAt).length;
    const sorted = [...rows].sort((a, b) => {
      const aw = !a.confirmedAt, bw = !b.confirmedAt;
      if (aw !== bw) return aw ? -1 : 1;
      return a.checkedOutAt < b.checkedOutAt ? (aw ? -1 : 1) : (aw ? 1 : -1);
    });
    app.innerHTML = `
      <header class="top">
        <div><div class="brand">BP Kids · Admin overview</div><h1>Today's checkouts</h1><div class="sub">${data ? new Date(data.date + "T12:00:00").toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" }) : ""}</div></div>
      </header>
      ${lastError ? `<div class="banner">${esc(lastError)} — retrying…</div>` : ""}
      <div class="stats">
        <div class="stat"><div class="n">${all.length}</div><div class="l">Checked out at desk</div></div>
        <div class="stat wait"><div class="n">${waitingCount(all)}</div><div class="l">Waiting on room</div></div>
        <div class="stat ok"><div class="n">${all.length - waitingCount(all)}</div><div class="l">Confirmed by room</div></div>
      </div>
      <div class="chips">
        <button class="chip ${filter === "all" ? "on" : ""}" data-filter="all">All rooms${waitingCount(all) ? `<span class="c">${waitingCount(all)}</span>` : ""}</button>
        ${ROOMS.map((r) => { const list = all.filter((p) => p.room === r.slug); const w = waitingCount(list);
          return `<button class="chip ${filter === r.slug ? "on" : ""}" data-filter="${r.slug}">${esc(r.name)} · ${list.length}${w ? `<span class="c">${w}</span>` : ""}</button>`; }).join("")}
      </div>
      ${!data ? `<div class="empty">Loading…</div>` : !rows.length ? `<div class="empty">No checkouts yet today.</div>` : `
      <div class="table-wrap"><table>
        <thead><tr><th>Child</th><th>Parent</th><th>Room</th><th>Code</th><th>Checked out</th><th>Room confirmed</th><th>Status</th></tr></thead>
        <tbody>${sorted.map((p) => {
          const late = !p.confirmedAt && minsSince(p.checkedOutAt) >= LATE_MIN;
          const status = p.confirmedAt ? `<span class="pill ok">Confirmed</span><button class="undo" data-undo="${esc(p.id)}">undo</button>`
            : `<span class="pill ${late ? "late" : "wait"}">Waiting · ${minsSince(p.checkedOutAt)} min</span>`;
          return `<tr><td><b>${esc(p.firstName)} ${esc(p.lastName)}</b></td><td>${esc(p.parentName || "—")}</td><td>${esc(p.roomName)}</td><td><span class="code">${esc(p.securityCode)}</span></td>
            <td>${fmtTime(p.checkedOutAt)}</td><td>${p.confirmedAt ? fmtTime(p.confirmedAt) : "—"}</td><td>${status}</td></tr>`; }).join("")}
        </tbody></table></div>`}`;
    app.querySelectorAll("[data-filter]").forEach((b) => b.onclick = () => { filter = b.dataset.filter; render(); });
    app.querySelectorAll("[data-undo]").forEach((b) => b.onclick = () => undoConfirm(b.dataset.undo));
  }

  const barEl = document.getElementById("bar");
  function renderBar() {
    const right = view === "home" ? "" : `<div style="display:flex;gap:12px;align-items:center">${statusHtml()}<a class="link-btn" href="./">Rooms</a></div>`;
    barEl.innerHTML = `<a class="lockup" href="./"><span class="mark"><img src="logo.png" alt="" onerror="this.replaceWith(document.createTextNode('B'))"></span>
      <span class="wordmark">BLUEPRINT CHURCH<small>BP KIDS PICKUP</small></span></a>${right}`;
  }

  function render() {
    renderBar();
    if (view === "home") return renderHome();
    if (view === "room") return room ? renderRoom() : renderHome();
    return renderOverview();
  }

  // ---------- start ----------
  if (view === "room" && !room) { location.href = "./"; return; }
  render();
  if (view === "overview") { if (pin) { started = true; poll(); } else askPin(); }
  // Room boards wait for a tap (browsers only allow sound after a tap).
})();
</script>
</body>
</html>
